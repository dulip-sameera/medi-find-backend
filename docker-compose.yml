services:
  # --- Infrastructure Services ---

  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    env_file:
      - ./config-server/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - medifind-network

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      # Tells the Eureka Config Client where to find the server
      - CONFIG_SERVER_URL=http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy # Wait until Config Server passes its health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - medifind-network
    
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - medifind-network

  # --- Databases ---

  auth-db:
    image: postgres:15-alpine
    container_name: medifind_auth_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${AUTH_PORT}:5432"
    volumes:
      - auth_data:/var/lib/postgresql/data
      - ./db/auth/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - medifind-network

  medicine-db:
    image: postgres:15-alpine
    container_name: medifind_medicine_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: medicine_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${MEDICINE_PORT}:5432"
    volumes:
      - medicine_data:/var/lib/postgresql/data
      - ./db/medicine/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - medifind-network

  pharmacy-db:
    image: postgres:15-alpine
    container_name: medifind_pharmacy_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pharmacy_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${PHARMACY_PORT}:5432"
    volumes:
      - pharmacy_data:/var/lib/postgresql/data
      - ./db/pharmacy/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - medifind-network

  patient-db:
    image: postgres:15-alpine
    container_name: medifind_patient_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: patient_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${PATIENT_PORT}:5432"
    volumes:
      - patient_data:/var/lib/postgresql/data
      - ./db/patient/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - medifind-network

# --- Networks ---
networks:
  medifind-network:
    driver: bridge

# --- DB Volumes ---

volumes:
  auth_data:
  medicine_data:
  pharmacy_data:
  patient_data: